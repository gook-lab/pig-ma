<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; padding: 16px; background: #fff; }
  h2 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #1a1a1a; }
  p { font-size: 12px; color: #666; margin-bottom: 12px; line-height: 1.5; }
  textarea {
    width: 100%; height: 140px; padding: 10px; border: 1px solid #ddd;
    border-radius: 8px; font-family: monospace; font-size: 11px;
    resize: vertical; outline: none; transition: border-color 0.15s;
  }
  textarea:focus { border-color: #7c3aed; }
  .btn {
    display: block; width: 100%; margin-top: 12px; padding: 10px;
    background: #7c3aed; color: white; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s;
  }
  .btn:hover { background: #6d28d9; }
  .btn:disabled { background: #d1d5db; cursor: not-allowed; }
  .status { margin-top: 8px; font-size: 11px; text-align: left; white-space: pre-wrap; word-break: break-all; }
  .status.success { color: #16a34a; }
  .status.error { color: #dc2626; }
  .status.info { color: #2563eb; }
</style>
</head>
<body>
  <h2>pig-ma Import</h2>
  <p>Paste the JSON copied from pig-ma (Export → Copy for Figma)</p>
  <textarea id="input" placeholder='Paste pig-ma JSON here...'></textarea>
  <button class="btn" id="importBtn" onclick="handleImport()">Import</button>
  <div class="status" id="status"></div>

  <script>
    function handleImport() {
      const input = document.getElementById('input');
      const status = document.getElementById('status');
      const btn = document.getElementById('importBtn');
      const raw = input.value.trim();

      if (!raw) {
        status.className = 'status error';
        status.textContent = 'Please paste JSON data first';
        return;
      }

      try {
        const data = JSON.parse(raw);

        // Validate structure
        if (!data.document) {
          status.className = 'status error';
          status.textContent = 'Missing "document" key. Keys found: ' + Object.keys(data).join(', ');
          return;
        }
        if (!data.document.children || !data.document.children[0]) {
          status.className = 'status error';
          status.textContent = 'Missing document.children. Structure: ' + JSON.stringify(Object.keys(data.document));
          return;
        }

        const nodeCount = data.document.children[0].children?.length || 0;
        status.className = 'status info';
        status.textContent = 'Parsed OK. ' + nodeCount + ' nodes found. Sending to plugin...';

        btn.disabled = true;
        parent.postMessage({ pluginMessage: { type: 'import', data } }, '*');
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'JSON parse error: ' + e.message + '\n\nFirst 100 chars: ' + raw.substring(0, 100);
      }
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      const status = document.getElementById('status');
      const btn = document.getElementById('importBtn');

      if (msg.type === 'done') {
        status.className = 'status success';
        status.textContent = msg.debug || ('Imported ' + msg.count + ' objects');
        btn.disabled = false;
      } else if (msg.type === 'progress') {
        status.className = 'status info';
        status.textContent = msg.message;
      } else if (msg.type === 'error') {
        status.className = 'status error';
        status.textContent = msg.message;
        btn.disabled = false;
      }
    };

    document.getElementById('input').focus();
  </script>
</body>
</html>
